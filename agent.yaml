spec_version: "0.1.0"
name: rust-memory-safety-borrow-checker
version: 1.0.0
description: Audits unsafe Rust blocks and C foreign function interface (FFI) boundaries to generate machine-checked non-aliasing and lifetime invariant proofs.
author: "Rucha Salpure"
license: MIT
model:
  preferred: claude-opus-4-6
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.2
    max_tokens: 4096
skills:
  - stacked-borrows-aliasing-proof
tools: []
delegation:
  mode: auto
runtime:
  max_turns: 50
  timeout: 300
compliance:
  risk_tier: standard
  frameworks: []
tags:
  - devtools
  - autonomous-agent
  - opengap-verified
metadata:
  repository: "https://github.com/ruchasalpure/rust-memory-safety-borrow-checker"
